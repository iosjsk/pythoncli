name: CI
on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
      - feature/**
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: install dependencies